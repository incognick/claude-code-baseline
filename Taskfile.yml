# Task is the project's entrypoint for build, test, and lint. https://taskfile.dev
# The agent runs these; the human does not need to. ADR tooling lives in scripts/ and is
# invoked by the agent directly.
version: '3'

tasks:
  default:
    cmds:
      - task --list

  lint:
    desc: All lints. Add project lints here once the stack ADR is accepted.
    cmds:
      - scripts/adr-lint.sh

  test:
    desc: Run the test suite. Wire up once the stack ADR is accepted.
    cmds:
      - echo "no tests yet"
